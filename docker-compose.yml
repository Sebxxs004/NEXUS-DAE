services:
  postgres:
    image: postgres:15-alpine
    container_name: prisma-dae-db
    environment:
      POSTGRES_USER: prisma_admin
      POSTGRES_PASSWORD: prisma_secure_2026
      POSTGRES_DB: prisma_dae
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - prisma-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prisma_admin -d prisma_dae"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: nexus-dae-app
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: prisma_admin
      DB_PASSWORD: prisma_secure_2026
      DB_NAME: prisma_dae
      DB_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - prisma-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  prisma-network:
    driver: bridge
